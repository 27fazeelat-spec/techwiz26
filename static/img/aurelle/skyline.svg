<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" preserveAspectRatio="xMaxYMax slice" role="img" aria-label="Illustration of Aurelle properties">
  <defs>
    <linearGradient id="s-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#26365F"/></linearGradient>
    <radialGradient id="s-glow" cx="0.82" cy="0.9" r="0.6"><stop offset="0" stop-color="#E7B24C" stop-opacity="0.55"/><stop offset="1" stop-color="#E7B24C" stop-opacity="0"/></radialGradient>
    <linearGradient id="s-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E4170"/><stop offset="1" stop-color="#1B2848"/></linearGradient>
    <linearGradient id="s-b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4E82"/><stop offset="1" stop-color="#22305A"/></linearGradient>
    <linearGradient id="s-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A3"/><stop offset="1" stop-color="#E7B24C"/></linearGradient>
    <pattern id="s-win" width="16" height="18" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="7" height="9" rx="1.5" fill="url(#s-w)" opacity="0.85"/></pattern>
    <pattern id="s-win2" width="16" height="18" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="7" height="9" rx="1.5" fill="#FFE7A3" opacity="0.25"/></pattern>
  </defs>
  <rect width="1200" height="240" fill="url(#s-sky)"/>
  <rect width="1200" height="240" fill="url(#s-glow)"/>
  <g fill="#fff"><circle cx="120" cy="40" r="1.2" opacity="0.6"/><circle cx="360" cy="24" r="1" opacity="0.5"/><circle cx="520" cy="60" r="0.9" opacity="0.4"/><circle cx="700" cy="30" r="1.1" opacity="0.6"/><circle cx="940" cy="50" r="1" opacity="0.5"/></g>
  <circle cx="1010" cy="70" r="22" fill="#F6D98A" opacity="0.85"/>
  <g transform="translate(560 0)">
    <!-- heritage property -->
    <rect x="0" y="150" width="120" height="90" fill="url(#s-b)"/><path d="M-6 152 L60 118 L126 152Z" fill="#2E4170"/>
    <rect x="10" y="164" width="100" height="70" fill="url(#s-win2)"/>
    <path d="M44 240 V206 a16 16 0 0 1 32 0 V240Z" fill="url(#s-w)"/>
    <!-- tower -->
    <rect x="140" y="60" width="90" height="180" fill="url(#s-b2)"/><rect x="150" y="70" width="70" height="160" fill="url(#s-win)"/>
    <rect x="178" y="40" width="14" height="22" fill="#3A4E82"/><circle cx="185" cy="36" r="4" fill="#F1D57A"/>
    <!-- resort -->
    <rect x="250" y="130" width="160" height="110" fill="url(#s-b)"/><rect x="260" y="140" width="140" height="92" fill="url(#s-win2)"/>
    <rect x="244" y="124" width="172" height="8" rx="2" fill="#3A4E82"/>
    <rect x="430" y="100" width="70" height="140" fill="url(#s-b2)"/><rect x="438" y="110" width="54" height="120" fill="url(#s-win)"/>
    <!-- residences -->
    <rect x="520" y="140" width="110" height="100" fill="url(#s-b)"/><rect x="528" y="148" width="94" height="84" fill="url(#s-win2)"/>
    <!-- palms -->
    <g fill="#0B1529">
      <path d="M230 240 C234 214 236 196 234 180" stroke="#0B1529" stroke-width="4" fill="none"/>
      <path d="M234 180 C214 172 198 176 186 186 C204 182 218 184 232 188Z"/><path d="M234 180 C250 166 268 164 280 170 C264 172 250 178 238 188Z"/>
      <path d="M234 180 C228 162 214 154 200 152 C214 162 224 172 232 186Z"/>
    </g>
  </g>
  <rect x="0" y="236" width="1200" height="4" fill="#C9A227" opacity="0.7"/>
</svg>

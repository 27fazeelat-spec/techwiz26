# Prompt-injection and adversarial-content detection (SRS Steps 42-43).
# Each family: regex patterns (case-insensitive), severity and action.
#   quarantine - the chunk is never sent to Gemini and never produces requirements
#   flag       - recorded for review; the chunk stays usable
# Hidden text (DOCX vanish, PDF white/tiny glyphs) is always excluded from generation and
# extraction, whatever it says; it is kept in raw_text as evidence.

families:
  instruction_override:
    severity: high
    action: quarantine
    patterns:
      - '\b(ignore|disregard|forget|override)\b.{0,20}\b(all|any|the)?\s*(previous|prior|above|earlier|preceding)\s+(instructions|rules|prompts|directions)'
  direct_instruction:
    severity: high
    action: quarantine
    patterns:
      - '\b(AI|assistant|language model|LLM|chatbot|automated system|automated systems|onboarding system|SkillSprint)\b.{0,60}\b(must|should|shall|mark|grant|approve|set|output|include|skip|add)\b'
      - '\bnote (to|for) (the )?(AI|assistant|model|onboarding system)'
      - '\bdecode and (follow|execute|run|apply)\b'
  system_impersonation:
    severity: high
    action: quarantine
    patterns:
      - '(^|\n|\s)(SYSTEM|ADMIN|ADMINISTRATOR|ASSISTANT|DEVELOPER)\s*:'
      - '\bset\s+[a-z_]+\s*=\s*(true|false|0|1)\b'
  fake_authority:
    severity: high
    action: quarantine
    patterns:
      - '\bmessage from the (CEO|chairman|chairwoman|managing director|board|head office|owner)\b'
  malicious_requirement:
    severity: high
    action: quarantine
    patterns:
      - '\badd (a|an|the) (new )?requirement\b'
      - '\bmark (all|every)\b.{0,40}\b(trained|onboarded|completed|verified)\b'
  prompt_extraction:
    severity: high
    action: quarantine
    patterns:
      - '\b(reveal|print|include|show|output)\b.{0,30}\b(system prompt|hidden instructions|your instructions|your prompt)\b'
  structure_injection:
    severity: medium
    action: quarantine
    patterns:
      - '"\s*\}\s*\]'
      - '"(status|coverage|verified|mandatory|score)"\s*:'
  markup_injection:
    severity: medium
    action: quarantine
    patterns:
      - '<\s*(script|iframe|object|embed|svg)\b'
      - '<\s*img\b[^>]*\bon\w+\s*='
      - '\bjavascript:'

# Base64 blobs are decoded and the decoded text is re-scanned with the families above.
encoded:
  min_length: 40
  severity: high
  action: quarantine

# Zero-width characters hidden inside words are reported as obfuscation when the cleaned text
# matches any family above.
obfuscation:
  severity: high
  action: quarantine

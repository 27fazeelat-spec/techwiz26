# Application roles -> permissions. "*" is a wildcard: "documents.*" grants every documents permission.
# Checked server-side on every route by src/rbac.py.
roles:
  admin:
    label: Administrator
    permissions: ["*"]
  training_manager:
    label: Training Manager
    permissions:
      - dashboard.admin
      - documents.*
      - roles.*
      - requirements.*
      - matrix.*
      - conflicts.view        # deciding conflicts is the reviewer's job
      - security.view
      - employees.*
      - plans.*
      - review.view
      - reports.view
  reviewer:
    label: Reviewer
    permissions:
      - dashboard.admin
      - documents.view
      - roles.view
      - requirements.view
      - matrix.view
      - conflicts.view
      - conflicts.resolve     # decide conflicts; re-running detection is the administrator's job
      - security.view
      - plans.view
      - review.*
      - reports.view
      - audit.view
  manager:
    label: Manager
    permissions:
      - dashboard.team
      - employees.view_team
      - plans.view_team
      - progress.verify_team
      - reports.team
      - bot.answer             # reply to questions the team sent from Ask the bot
  employee:
    label: Employee
    permissions:
      - dashboard.employee
      - learning.*
      - bot.ask
  # SkillSprint's own people. They never belong to a client workspace.
  platform_admin:
    label: SkillSprint staff
    permissions:
      - console.*              # demo requests, demo accounts, workspace figures; no client content
  demo:
    label: Demo visitor
    permissions:               # look, never change: every other request is refused (src/__init__.py)
      - dashboard.admin
      - documents.view
      - roles.view
      - requirements.view
      - matrix.view
      - conflicts.view
      - security.view
      - plans.view
      - review.view
      - reports.view
      - bot.ask                # answered as the sample employee; nothing is stored
